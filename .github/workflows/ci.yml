name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff pyflakes
      - run: ruff check .
      - run: python -m pyflakes aiswitch.py tests tools

  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; macos-15-intel covers Intel Macs (macos-13 is retired).
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit + e2e tests (hermetic)
        run: python -m unittest discover -s tests -v

  windows-legacy-encoding:
    # Simulates a default Windows console/locale: no UTF-8 mode, cp1252 stdio.
    runs-on: windows-latest
    env:
      PYTHONUTF8: "0"
      PYTHONIOENCODING: cp1252
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python aiswitch.py doctor

  macos-real-keychain:
    # Contract tests against the real `security` tool, using a throw-away keychain.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: create and unlock a throw-away keychain
        run: |
          security create-keychain -p ci aiswitch-ci.keychain
          security list-keychains -d user -s aiswitch-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s aiswitch-ci.keychain
          security unlock-keychain -p ci aiswitch-ci.keychain
          security set-keychain-settings aiswitch-ci.keychain
      - name: keychain contract tests
        env:
          AISWITCH_TEST_REAL_STORE: "1"
        run: python -m unittest tests.test_aiswitch.TestMacKeychain -v
      - if: always()
        run: security delete-keychain aiswitch-ci.keychain || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - run: python tools/build_pyz.py
      - name: smoke-test the wheel and the zipapp
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/aiswitch --version
          HOME=$(mktemp -d) /tmp/v/bin/aiswitch doctor
          python dist/aiswitch.pyz --version
