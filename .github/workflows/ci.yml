name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff pyflakes
      - run: ruff check .
      - run: python -m pyflakes aiswitch.py tests tools

  test:
    # Every OS x CPU architecture GitHub hosts. aiswitch is pure Python; this proves it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          - os: windows-11-arm          # setup-python has native ARM64 Windows builds from 3.11
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit + e2e tests (hermetic)
        run: python -m unittest discover -s tests -v

  windows-32bit-python:
    # 32-bit Python on 64-bit Windows (WOW64): %ProgramFiles% redirection, ctypes pointer sizes.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x86
      - run: python -m unittest discover -s tests -v
      - run: python aiswitch.py doctor

  windows-legacy-encoding:
    # A default Windows console/locale: no UTF-8 mode, cp1252 stdio.
    runs-on: windows-latest
    env:
      PYTHONUTF8: "0"
      PYTHONIOENCODING: cp1252
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python aiswitch.py doctor

  alpine-musl:
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v
      - run: python aiswitch.py doctor

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: pkg install -y python3
          run: |
            python3 -m unittest discover -s tests -v
            python3 aiswitch.py doctor

  real-keystores:
    # Contract + end-to-end tests against the real OS secret stores, with throw-away items.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AISWITCH_TEST_REAL_STORE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux - Secret Service (gnome-keyring on a private session bus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring libsecret-tools dbus-x11
          dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /tmp/kr.env;
            export $(cat /tmp/kr.env); sleep 1;
            python -m unittest tests.test_aiswitch.TestSecretServiceReal tests.test_aiswitch.TestSecretServiceEndToEnd -v'
      - name: macOS - Keychain (throw-away keychain)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci aiswitch-ci.keychain
          security list-keychains -d user -s aiswitch-ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s aiswitch-ci.keychain
          security unlock-keychain -p ci aiswitch-ci.keychain
          security set-keychain-settings aiswitch-ci.keychain
          python -m unittest tests.test_aiswitch.TestMacKeychainReal -v
      - name: macOS - cleanup
        if: always() && runner.os == 'macOS'
        run: security delete-keychain aiswitch-ci.keychain || true
      - name: Windows - Credential Manager + DPAPI
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_aiswitch.TestWinCredReal -v

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - run: python tools/build_pyz.py
      - name: smoke-test the wheel and the zipapp
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/v"
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/v/Scripts"; else bin="$RUNNER_TEMP/v/bin"; fi
          "$bin/pip" install dist/*.whl
          "$bin/aiswitch" --version
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          "$bin/aiswitch" doctor
          python dist/aiswitch.pyz --version
          python dist/aiswitch.pyz doctor
